<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06B6D4" />
      <stop offset="50%" stop-color="#3B82F6" />
      <stop offset="100%" stop-color="#6366F1" />
    </linearGradient>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B1120" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Background Shield/Rounded Hexagon -->
  <rect width="64" height="64" rx="14" fill="url(#bgGrad)" stroke="#1E293B" stroke-width="2" />
  <rect x="2" y="2" width="60" height="60" rx="12" fill="none" stroke="url(#grad1)" stroke-width="1.5" stroke-opacity="0.6" />
  
  <!-- Code brackets symbol < / > subtle -->
  <path d="M 12 32 L 18 24 M 12 32 L 18 40" stroke="#06B6D4" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" opacity="0.8"/>
  <path d="M 52 32 L 46 24 M 52 32 L 46 40" stroke="#6366F1" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" opacity="0.8"/>
  
  <!-- Central 'AD' Monogram -->
  <text x="32" y="39" font-family="'Outfit', 'Inter', -apple-system, sans-serif" font-size="20" font-weight="900" text-anchor="middle" fill="url(#grad1)" filter="url(#glow)" letter-spacing="-0.5">AD</text>
  
  <!-- Top engineer node -->
  <circle cx="32" cy="11" r="2.5" fill="#38BDF8" />
  <line x1="32" y1="13.5" x2="32" y2="18" stroke="#38BDF8" stroke-width="1.5" stroke-dasharray="1 1" opacity="0.8" />
</svg>
